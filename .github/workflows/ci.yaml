name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# This initial CI workflow only validates code. Image publishing and Kubernetes
# deployment remain the responsibility of later, explicitly reviewed workflows.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: be/go.mod
          cache-dependency-path: be/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test backend
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Build production artifacts
        run: npm run build

      - name: Render core Kubernetes manifests
        run: kubectl kustomize deployment > /dev/null
