name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pull requests only validate code. A successful push to main publishes immutable
# images and records their SHA tags in the GitOps manifests for Argo CD.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect deployable changes
    runs-on: ubuntu-latest
    outputs:
      controller: ${{ steps.filter.outputs.controller }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect image sources that changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            controller:
              - 'be/**'
              - '.dockerignore'
            frontend:
              - 'fe/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - '.dockerignore'

  validate:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: be/go.mod
          cache-dependency-path: be/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test backend
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Build production artifacts
        run: npm run build

      - name: Render core Kubernetes manifests
        run: kubectl kustomize deployment > /dev/null

  publish-images:
    name: Build and publish container images
    needs: [validate, changes]
    # Pull requests validate code only. Publishing occurs only after a successful
    # validation run for a commit that has reached the protected main branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ${{ github.repository_owner }}/webgis

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push controller
        if: needs.changes.outputs.controller == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: be/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/controller:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push frontend
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fe/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  update-deployment-images:
    name: Update GitOps image tags
    needs: [publish-images, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure main has not advanced during the build
        id: source
        run: |
          if [ "$(git rev-parse HEAD)" = "${GITHUB_SHA}" ]; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
            echo "main advanced while this build was running; skipping stale GitOps update."
          fi

      - name: Set immutable image tags in manifests
        if: steps.source.outputs.matches == 'true'
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/webgis
        run: |
          if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            sed -i -E "s|(image: ${IMAGE_PREFIX}/frontend):sha-[0-9a-f]{40}|\\1:${IMAGE_TAG}|" deployment/frontend.yaml
            grep -F "image: ${IMAGE_PREFIX}/frontend:${IMAGE_TAG}" deployment/frontend.yaml
          fi
          if [ "${{ needs.changes.outputs.controller }}" = "true" ]; then
            sed -i -E "s|(image: ${IMAGE_PREFIX}/controller):sha-[0-9a-f]{40}|\\1:${IMAGE_TAG}|" deployment/controller.yaml
            sed -i -E "s|(image: ${IMAGE_PREFIX}/controller):sha-[0-9a-f]{40}|\\1:${IMAGE_TAG}|" deployment/migration-job.yaml
            grep -F "image: ${IMAGE_PREFIX}/controller:${IMAGE_TAG}" deployment/controller.yaml
            grep -F "image: ${IMAGE_PREFIX}/controller:${IMAGE_TAG}" deployment/migration-job.yaml
          fi

      - name: Commit manifest update
        if: steps.source.outputs.matches == 'true'
        run: |
          if git diff --quiet -- deployment/frontend.yaml deployment/controller.yaml deployment/migration-job.yaml; then
            echo "Image tags already match this build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/frontend.yaml deployment/controller.yaml deployment/migration-job.yaml
          git commit -m "chore(deploy): use images for ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:main
