apiVersion: v1
kind: ConfigMap
metadata:
  name: webgis-config
  labels:
    app.kubernetes.io/part-of: webgis
data:
  NODE_ENV: production
  AUTH_PORT: "3001"
  AUTH_JWT_ISSUER: auth-service
  AUTH_JWT_AUDIENCE: api-gateway
  AUTH_JWT_KID: primary-2026
  AUTH_ACCESS_TOKEN_TTL_SECONDS: "900"
  AUTH_REFRESH_TOKEN_TTL_DAYS: "30"
  AUTH_SESSION_IDLE_TIMEOUT_SECONDS: "7200"
  AUTH_COOKIE_NAME: webgis_refresh_token
  AUTH_SECURE_COOKIES: "false"
  AUTH_COOKIE_SAME_SITE: lax
  AUTH_DEV_EPHEMERAL_KEYS: "false"
  APP_ORIGINS: http://webgis.localhost,http://192.168.0.191
  VALHALLA_INTERNAL_URL: http://valhalla:8002
  TILE_SERVER_INTERNAL_URL: http://tile-server:8080
  NOMINATIM_INTERNAL_URL: http://nominatim:8083
  ELASTICSEARCH_URL: http://elasticsearch:9200
  GIS_RAW_STORAGE_DRIVER: filesystem
  # Filesystem is a local-development fallback. Production overlays must use
  # the private Ceph RGW/S3 adapter and credentials from webgis-secrets.
  GIS_RAW_STORAGE_PATH: /tmp/gis-raw
  GIS_UPLOAD_MAX_BYTES: "1073741824"
  GIS_JOB_LEASE_SECONDS: "900"
