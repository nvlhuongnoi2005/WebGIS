apiVersion: v1
kind: Service
metadata:
  name: auth-postgres
  labels:
    app.kubernetes.io/name: auth-postgres
    app.kubernetes.io/part-of: webgis
spec:
  selector:
    app.kubernetes.io/name: auth-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-postgres
  labels:
    app.kubernetes.io/name: auth-postgres
    app.kubernetes.io/part-of: webgis
spec:
  serviceName: auth-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-postgres
        app.kubernetes.io/part-of: webgis
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: webgis
            - name: POSTGRES_USER
              value: webgis_auth
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: webgis-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U webgis_auth -d webgis"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U webgis_auth -d webgis"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
