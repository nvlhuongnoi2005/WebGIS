apiVersion: apps/v1
kind: Deployment
metadata:
  name: tile-server
  labels:
    app.kubernetes.io/name: tile-server
    app.kubernetes.io/part-of: webgis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tile-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tile-server
        app.kubernetes.io/part-of: webgis
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: tile-server
          image: quanghuy2307/tile-server:0.0.17
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          volumeMounts:
            - name: data
              mountPath: /tile-server/data
              readOnly: true
            - name: gis-published
              mountPath: /tile-server/data/gis
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tile-data
        - name: gis-published
          persistentVolumeClaim:
            claimName: gis-published-data
---
apiVersion: v1
kind: Service
metadata:
  name: tile-server
  labels:
    app.kubernetes.io/name: tile-server
    app.kubernetes.io/part-of: webgis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tile-server
  ports:
    - name: http
      port: 8080
      targetPort: http
