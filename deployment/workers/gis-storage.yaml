# The cluster administrator must bind these RWX claims to a CephFS-capable
# StorageClass (via the default class or an environment-specific overlay).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gis-workspace
  labels:
    app.kubernetes.io/part-of: webgis
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gis-published-data
  labels:
    app.kubernetes.io/part-of: webgis
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 50Gi
