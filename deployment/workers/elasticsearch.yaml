apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: webgis
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: webgis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/part-of: webgis
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
          imagePullPolicy: IfNotPresent
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - name: http
              containerPort: 9200
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: elasticsearch-data
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: webgis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elasticsearch-private
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: controller
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: search-indexer
      ports:
        - protocol: TCP
          port: 9200
---
apiVersion: batch/v1
kind: Job
metadata:
  name: search-indexer
  labels:
    app.kubernetes.io/name: search-indexer
    app.kubernetes.io/part-of: webgis
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: search-indexer
        app.kubernetes.io/part-of: webgis
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: indexer
          image: ghcr.io/nvlhuongnoi2005/webgis/controller:sha-dddf700f26a39dbc13c024a146a1c635cad62bfa
          imagePullPolicy: IfNotPresent
          command: ["/controller", "index-suggestions"]
          envFrom:
            - configMapRef:
                name: webgis-config
            - secretRef:
                name: webgis-secrets
          env:
            - name: NOMINATIM_DB_USER
              valueFrom:
                secretKeyRef:
                  name: nominatim-db-credentials
                  key: POSTGRES_USER
            - name: NOMINATIM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nominatim-db-credentials
                  key: POSTGRES_PASSWORD
