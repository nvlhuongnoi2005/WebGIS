apiVersion: apps/v1
kind: Deployment
metadata:
  name: gdal-worker
  labels:
    app.kubernetes.io/name: gdal-worker
    app.kubernetes.io/part-of: webgis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gdal-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gdal-worker
        app.kubernetes.io/part-of: webgis
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: worker
          image: ghcr.io/nvlhuongnoi2005/webgis/gdal-worker:dev
          imagePullPolicy: Always
          args: ["gdal-worker"]
          envFrom:
            - configMapRef:
                name: webgis-config
            - secretRef:
                name: webgis-secrets
          env:
            - name: GIS_WORKSPACE_PATH
              value: /gis-workspace
            - name: GIS_PUBLISHED_PATH
              value: /gis-published
          volumeMounts:
            - name: workspace
              mountPath: /gis-workspace
            - name: published
              mountPath: /gis-published
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: gis-workspace
        - name: published
          persistentVolumeClaim:
            claimName: gis-published-data
