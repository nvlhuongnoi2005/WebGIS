apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webgis-auth-db
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nvlhuongnoi2005/WebGIS.git
    targetRevision: main
    path: deployment/db
  destination:
    server: https://kubernetes.default.svc
    namespace: webgis
  # Keep the first ownership hand-off manual. Enable automated sync only after
  # both this application and the existing WebGIS application are healthy.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
