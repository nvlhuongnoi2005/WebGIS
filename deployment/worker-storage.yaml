# Apply this before workers.yaml. Docker Desktop's hostpath provisioner creates
# backing volumes locally; production needs a StorageClass with backups.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tile-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: map-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nominatim-project
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nominatim-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: nominatim-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nominatim-db
  labels:
    app.kubernetes.io/name: nominatim-db
    app.kubernetes.io/part-of: webgis
spec:
  serviceName: nominatim-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nominatim-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nominatim-db
        app.kubernetes.io/part-of: webgis
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nominatim-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nominatim-db-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 30Gi
