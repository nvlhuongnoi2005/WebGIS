# Converts Valhalla's gzip-compressed HGT tiles into a visual raster overlay.
apiVersion: batch/v1
kind: Job
metadata:
  name: generate-elevation-hillshade
  namespace: webgis
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: gdal
          image: ghcr.io/osgeo/gdal:ubuntu-small-latest
          command: ["/bin/bash", "-ec"]
          args:
            - |
              mkdir -p /work /target/mbtiles/elevation_hillshade
              test ! -e /target/mbtiles/elevation_hillshade/elevation_hillshade.mbtiles

              # GDAL's HGT driver must access Valhalla's .hgt.gz files through
              # the gzip virtual filesystem. This avoids a multi-gigabyte
              # temporary decompression on the PVC.
              find /source/elevation_data -name "*.hgt.gz" -printf "/vsigzip/%p\n" > /work/dem-files.txt
              test -s /work/dem-files.txt

              gdalbuildvrt -input_file_list /work/dem-files.txt /work/vietnam-dem.vrt

              gdaldem hillshade /work/vietnam-dem.vrt /work/elevation-hillshade.tif \
                -multidirectional -compute_edges -s 111120 \
                -of GTiff -co COMPRESS=DEFLATE -co TILED=YES

              gdal_translate /work/elevation-hillshade.tif \
                /target/mbtiles/elevation_hillshade/elevation_hillshade.mbtiles \
                -of MBTILES \
                -co NAME=elevation_hillshade \
                -co DESCRIPTION="Vietnam elevation hillshade" \
                -co TYPE=overlay \
                -co TILE_FORMAT=PNG \
                -co ZOOM_LEVEL_STRATEGY=LOWER

              gdaladdo -r average /target/mbtiles/elevation_hillshade/elevation_hillshade.mbtiles \
                2 4 8 16 32 64 128 256

              python3 - <<'PY'
              import json

              config_path = "/target/config.json"
              with open(config_path, encoding="utf-8") as source:
                  config = json.load(source)
              config.setdefault("datas", {})["elevation_hillshade"] = {
                  "mbtiles": "elevation_hillshade/elevation_hillshade.mbtiles"
              }
              with open(config_path, "w", encoding="utf-8") as target:
                  json.dump(config, target, ensure_ascii=False, indent=2)
                  target.write("\n")
              PY
          volumeMounts:
            - name: map-data
              mountPath: /source
              readOnly: true
            - name: tile-data
              mountPath: /target
      volumes:
        - name: map-data
          persistentVolumeClaim:
            claimName: map-data
        - name: tile-data
          persistentVolumeClaim:
            claimName: tile-data
