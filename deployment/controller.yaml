apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  labels:
    app.kubernetes.io/name: controller
    app.kubernetes.io/part-of: webgis
spec:
  replicas: 1
  # Delete prior ReplicaSets after a successful rollout. Rollbacks use GitOps by
  # re-applying a previous immutable image tag instead of retaining stale pods.
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: controller
        app.kubernetes.io/part-of: webgis
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: controller
          image: ghcr.io/nvlhuongnoi2005/webgis/controller:sha-82860592809d0b6e972170fbb77754a8b53aa604
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: webgis-config
            - secretRef:
                name: webgis-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  labels:
    app.kubernetes.io/name: controller
    app.kubernetes.io/part-of: webgis
spec:
  selector:
    app.kubernetes.io/name: controller
  ports:
    - name: http
      port: 3001
      targetPort: http
