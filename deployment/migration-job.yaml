apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/name: auth-migrate
    app.kubernetes.io/part-of: webgis
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-migrate
        app.kubernetes.io/part-of: webgis
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: wait-for-auth-postgres
          image: postgres:16
          command: ["sh", "-ec"]
          args:
            - |
              until pg_isready -h auth-postgres -p 5432 -U webgis_auth -d webgis; do
                echo "Waiting for auth-postgres..."
                sleep 2
              done
      containers:
        - name: migrate
          image: ghcr.io/nvlhuongnoi2005/webgis/controller:sha-446e152c0e76eac5765efd0603a970668b3338aa
          imagePullPolicy: IfNotPresent
          command: ["/controller", "migrate"]
          envFrom:
            - configMapRef:
                name: webgis-config
            - secretRef:
                name: webgis-secrets
