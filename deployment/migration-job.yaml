apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/name: auth-migrate
    app.kubernetes.io/part-of: webgis
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-migrate
        app.kubernetes.io/part-of: webgis
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: migrate
          image: ghcr.io/nvlhuongnoi2005/webgis/controller:sha-c51b76ff226bfc618603f0b42ba234fabe19ac01
          imagePullPolicy: IfNotPresent
          command: ["/controller", "migrate"]
          envFrom:
            - configMapRef:
                name: webgis-config
            - secretRef:
                name: webgis-secrets
