apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  labels:
    app.kubernetes.io/name: auth-migrate
    app.kubernetes.io/part-of: webgis
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-migrate
        app.kubernetes.io/part-of: webgis
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: registry.example.com/webgis/controller:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          command: ["/controller", "migrate"]
          envFrom:
            - configMapRef:
                name: webgis-config
            - secretRef:
                name: webgis-secrets
