# Apply this only after deployment/worker-storage.yaml and the data-import steps
# in deployment/README.md. All services remain internal to the webgis namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tile-server
  labels:
    app.kubernetes.io/name: tile-server
    app.kubernetes.io/part-of: webgis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tile-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tile-server
        app.kubernetes.io/part-of: webgis
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: tile-server
          image: ghcr.io/nvlhuongnoi2005/webgis/tile-server:sha-dddf700f26a39dbc13c024a146a1c635cad62bfa
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          volumeMounts:
            - name: data
              mountPath: /tile-server/data
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tile-data
---
apiVersion: v1
kind: Service
metadata:
  name: tile-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tile-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valhalla
  labels:
    app.kubernetes.io/name: valhalla
    app.kubernetes.io/part-of: webgis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valhalla
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valhalla
        app.kubernetes.io/part-of: webgis
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: valhalla
          image: ghcr.io/nvlhuongnoi2005/webgis/valhalla:sha-dddf700f26a39dbc13c024a146a1c635cad62bfa
          imagePullPolicy: IfNotPresent
          args: ["build_tiles"]
          env:
            - name: server_threads
              value: "4"
            - name: serve_tiles
              value: "True"
            - name: use_tiles_ignore_pbf
              value: "False"
            - name: force_rebuild
              value: "False"
            - name: build_elevation
              value: "False"
            - name: build_admins
              value: "True"
            - name: build_time_zones
              value: "True"
            - name: build_transit
              value: "False"
            - name: build_tar
              value: "True"
            - name: tileset_name
              value: valhalla_tiles
            - name: update_existing_config
              value: "True"
          ports:
            - name: http
              containerPort: 8002
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /custom_files
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: map-data
---
apiVersion: v1
kind: Service
metadata:
  name: valhalla
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: valhalla
  ports:
    - name: http
      port: 8002
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nominatim
  labels:
    app.kubernetes.io/name: nominatim
    app.kubernetes.io/part-of: webgis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nominatim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nominatim
        app.kubernetes.io/part-of: webgis
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: nominatim
          image: ghcr.io/nvlhuongnoi2005/webgis/nominatim:sha-dddf700f26a39dbc13c024a146a1c635cad62bfa
          imagePullPolicy: IfNotPresent
          args: ["serve", "--engine", "falcon", "--server", "0.0.0.0:8083"]
          env:
            - name: NOMINATIM_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: nominatim-db-credentials
                  key: NOMINATIM_DATABASE_DSN
            - name: NOMINATIM_DATABASE_WEBUSER
              valueFrom:
                secretKeyRef:
                  name: nominatim-db-credentials
                  key: POSTGRES_USER
          ports:
            - name: http
              containerPort: 8083
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: project
              mountPath: /nominatim-project
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: map-data
        - name: project
          persistentVolumeClaim:
            claimName: nominatim-project
---
apiVersion: v1
kind: Service
metadata:
  name: nominatim
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nominatim
  ports:
    - name: http
      port: 8083
      targetPort: http
