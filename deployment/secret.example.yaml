# Do not apply this file as-is and never commit a populated copy.
# Create deployment/secret.yaml from this template, then apply it separately.
apiVersion: v1
kind: Secret
metadata:
  name: webgis-secrets
  namespace: webgis
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_WITH_A_LONG_RANDOM_PASSWORD
  DATABASE_URL: postgresql://webgis_auth:REPLACE_WITH_A_LONG_RANDOM_PASSWORD@auth-postgres:5432/webgis
  AUTH_REFRESH_TOKEN_PEPPER: REPLACE_WITH_AT_LEAST_32_RANDOM_BYTES
  # Keep the line breaks when inserting PEM-encoded Ed25519 keys.
  AUTH_JWT_PRIVATE_KEY: |-
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_ED25519_PRIVATE_KEY
    -----END PRIVATE KEY-----
  AUTH_JWT_PUBLIC_KEY: |-
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_ED25519_PUBLIC_KEY
    -----END PUBLIC KEY-----
